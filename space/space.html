<head>

        body {
            display: grid;

            background-color: rgb(237, 237, 237);

<body>
    <div style="padding-top:100px">
        <iframe id="player" width="100%" height="200" scrolling="no" allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https://soundcloud.com/ben-pace-701868704/saveme?si=7034f394214b47089b659d83d2aad634&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing;{ ADD YOUR PARAMETERS HERE }">
        </iframe>
    </div>

    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script type="module">
        let iframeElement   = document.getElementById('player');
        console.log(iframeElement.id);
        let widget = SC.Widget(iframeElement.id);
        
    
        async function widgetReady(w) {
            return new Promise(resolve => w.bind(SC.Widget.Events.READY, resolve));
        }
        await widgetReady(widget);
        widget.play();

        widget.seekTo(10000);
    </script>

</body>
